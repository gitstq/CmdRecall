[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdrecall"
version = "1.0.0"
description = "🧠 Lightweight Terminal Command History Intelligent Recall Engine"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "gitstq", email = "gitstq@users.noreply.github.com"}
]
maintainers = [
    {name = "gitstq", email = "gitstq@users.noreply.github.com"}
]
keywords = [
    "cli",
    "command-line",
    "history",
    "search",
    "terminal",
    "shell",
    "bash",
    "zsh",
    "fish",
    "tfidf",
    "bm25",
    "fuzzy-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: System :: Shells",
    "Topic :: Text Processing :: Indexing",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.40.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
cmdrecall = "cmdrecall.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/CmdRecall"
Documentation = "https://github.com/gitstq/CmdRecall#readme"
Repository = "https://github.com/gitstq/CmdRecall.git"
Issues = "https://github.com/gitstq/CmdRecall/issues"
Changelog = "https://github.com/gitstq/CmdRecall/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["cmdrecall*"]

[tool.setuptools.package-data]
cmdrecall = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
